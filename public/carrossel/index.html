<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Escolha fotos da galeria e veja passando devagar, em tela cheia." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carrossel" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Carrossel de Fotos</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #000;
        color: #f2f2f2;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      button { font: inherit; color: inherit; border: 0; cursor: pointer; }

      /* Tela inicial: escolher as fotos */
      #inicio {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      #inicio h1 { font-size: 26px; font-weight: 700; }
      #inicio p { color: #9a9a9a; font-size: 15px; max-width: 320px; line-height: 1.4; }
      .botao {
        width: 100%;
        max-width: 340px;
        padding: 16px 20px;
        border-radius: 14px;
        font-size: 17px;
        font-weight: 600;
        background: #222;
      }
      .botao.principal { background: #ffd166; color: #111; }
      .botao:disabled { opacity: .35; }

      #miniaturas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 6px;
        width: 100%;
        max-width: 340px;
        max-height: 40vh;
        overflow-y: auto;
      }
      #miniaturas img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 8px;
        background: #1a1a1a;
      }

      .opcoes { width: 100%; max-width: 340px; display: grid; gap: 14px; text-align: left; }
      .opcoes label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
      .opcoes input[type='range'] { flex: 1; accent-color: #ffd166; }
      .opcoes input[type='checkbox'] { width: 22px; height: 22px; accent-color: #ffd166; }

      /* Carrossel em tela cheia */
      #palco {
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
        display: none;
        touch-action: none;
      }
      #palco.ativo { display: block; }
      #faixa {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        display: flex;
        will-change: transform;
      }
      #faixa img {
        flex: none;
        width: 100vw;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      #palco.preencher #faixa img { object-fit: cover; }

      /* Controles que aparecem ao tocar na tela */
      #controles {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 16px 16px max(20px, env(safe-area-inset-bottom));
        background: linear-gradient(transparent, rgba(0, 0, 0, .7));
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s;
      }
      #palco.mostrar #controles { opacity: 1; pointer-events: auto; }
      #controles button {
        padding: 12px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, .16);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main id="inicio">
      <h1>Carrossel de Fotos</h1>
      <p>Escolha as fotos da galeria e aperte OK. Elas passam devagar, da direita para a esquerda, em tela cheia.</p>

      <input id="arquivos" type="file" accept="image/*" multiple hidden />
      <button id="escolher" class="botao">Escolher fotos</button>

      <div id="miniaturas"></div>

      <div class="opcoes">
        <label>Velocidade <input id="velocidade" type="range" min="1" max="10" value="3" /></label>
        <label>Preencher a tela (corta as bordas) <input id="preencher" type="checkbox" checked /></label>
      </div>

      <button id="ok" class="botao principal" disabled>OK</button>
    </main>

    <div id="palco" class="preencher">
      <div id="faixa"></div>
      <div id="controles">
        <button id="pausar">Pausar</button>
        <button id="sair">Sair</button>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const inicio = $('inicio');
      const arquivos = $('arquivos');
      const miniaturas = $('miniaturas');
      const ok = $('ok');
      const palco = $('palco');
      const faixa = $('faixa');
      const velocidade = $('velocidade');
      const preencher = $('preencher');
      const pausar = $('pausar');

      let urls = [];
      let posicao = 0; // em "fotos": 1.5 = metade da segunda foto
      let pausado = false;
      let ultimoQuadro = 0;
      let quadro = 0;
      let travaTela = null;
      let esconderControles = 0;

      // Velocidade 1 = uma foto a cada 20s; velocidade 10 = uma foto a cada 2s.
      const segundosPorFoto = () => 20 / Number(velocidade.value);

      $('escolher').addEventListener('click', () => arquivos.click());

      arquivos.addEventListener('change', () => {
        const novas = [...arquivos.files].filter((f) => f.type.startsWith('image/'));
        if (!novas.length) return;
        urls.forEach((u) => URL.revokeObjectURL(u));
        urls = novas.map((f) => URL.createObjectURL(f));
        miniaturas.replaceChildren(
          ...urls.map((src) => Object.assign(new Image(), { src, loading: 'lazy', decoding: 'async' }))
        );
        ok.disabled = false;
        ok.textContent = `OK (${urls.length} foto${urls.length > 1 ? 's' : ''})`;
      });

      preencher.addEventListener('change', () => palco.classList.toggle('preencher', preencher.checked));

      ok.addEventListener('click', comecar);

      function comecar() {
        // A lista vai duas vezes na faixa: quando a primeira volta termina, a
        // segunda esta exatamente no lugar dela e a posicao volta a zero sem salto.
        const imgs = [...urls, ...urls].map((src) =>
          Object.assign(new Image(), { src, decoding: 'async', draggable: false })
        );
        faixa.replaceChildren(...imgs);
        posicao = 0;
        pausado = false;
        pausar.textContent = 'Pausar';
        inicio.hidden = true;
        palco.classList.add('ativo');
        palco.requestFullscreen?.().catch(() => {});
        manterTelaLigada();
        ultimoQuadro = performance.now();
        quadro = requestAnimationFrame(animar);
      }

      function animar(agora) {
        const dt = Math.min(agora - ultimoQuadro, 100) / 1000;
        ultimoQuadro = agora;
        if (!pausado) {
          posicao += dt / segundosPorFoto();
          if (posicao >= urls.length) posicao -= urls.length;
        }
        faixa.style.transform = `translate3d(${-posicao * window.innerWidth}px,0,0)`;
        quadro = requestAnimationFrame(animar);
      }

      function sair() {
        cancelAnimationFrame(quadro);
        palco.classList.remove('ativo', 'mostrar');
        faixa.replaceChildren();
        inicio.hidden = false;
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        travaTela?.release().catch(() => {});
        travaTela = null;
      }

      // Tocar na tela mostra os controles por alguns segundos.
      palco.addEventListener('click', (e) => {
        if (e.target.closest('#controles')) return;
        palco.classList.toggle('mostrar');
        clearTimeout(esconderControles);
        esconderControles = setTimeout(() => palco.classList.remove('mostrar'), 3000);
      });

      pausar.addEventListener('click', () => {
        pausado = !pausado;
        pausar.textContent = pausado ? 'Continuar' : 'Pausar';
      });
      $('sair').addEventListener('click', sair);

      // Mantem a tela acesa enquanto as fotos passam (onde o navegador permitir).
      async function manterTelaLigada() {
        try {
          travaTela = await navigator.wakeLock?.request('screen');
        } catch {}
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && palco.classList.contains('ativo')) manterTelaLigada();
      });
    </script>
  </body>
</html>

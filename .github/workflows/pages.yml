name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/music-app-no-ads-enfqtb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez, sem cancelar a que ja estiver no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conferir tipos
        run: npx tsc --noEmit

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Liga o Pages no repositorio na primeira execucao.
          enablement: true

      # O site fica em /<repo>/, entao a build precisa gerar caminhos com esse
      # prefixo. O sufixo e normalizado para nao virar barra dupla.
      - name: Build
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: npx vite build --base="${BASE%/}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
